# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Jentic Arazzo Tools Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CPU_CORES: 2

jobs:
  lint-commit-messages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # necessary for linting commit messages
          ref: ${{ github.event.pull_request.head.sha }} # necessary to check out pull request HEAD commit instead of merge commit
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Install dependencies
        run: npm ci --engine-strict=false
      - name: Lint commit message
        if: github.ref != 'refs/heads/main' && github.actor != 'dependabot[bot]'
        run: |
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Install dependencies
        run: npm ci --engine-strict=false
      - name: Generate typescript declarations
        run: npm run typescript:declaration
        working-directory: ./packages/jentic-arazzo-parser
      - name: Lint code
        run: npm run lint

  check-typescript-types:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Install dependencies
        run: npm ci --engine-strict=false
      - name: Generate typescript declarations
        run: npm run typescript:declaration
      - name: Check TypeScript types
        run: npm run typescript:check-types

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Install dependencies
        run: npm ci --engine-strict=false
      - name: Build monorepo for testing
        run: npm run build:es
      - name: Execute tests in monorepo
        run: npm run test

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26.3.1
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'
    - name: Install dependencies
      run: npm ci --engine-strict=false
    - name: Build monorepo
      run: npm run build:es
    - name: Build ArazzoUI
      run: npm run build:app
      working-directory: ./packages/jentic-arazzo-ui
    - name: Upload build artifacts from ArazzoUI
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v7
      with:
        name: arazzo-ui-build
        path: ./packages/jentic-arazzo-ui/build

  public-package-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - run: npm ci --engine-strict=false
      - name: Build workspace runtime dependencies
        run: npm run build:es
      - name: Install public package acceptance browser
        run: npx playwright install --with-deps chromium
      - name: Verify generated declarations and installed package exports
        run: npm run test:package -w @jentic/arazzo-ui
      - name: Upload package acceptance identity and measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arazzo-ui-package-acceptance
          path: |
            packages/jentic-arazzo-ui/test-output/package-consumer/metadata.json
            packages/jentic-arazzo-ui/test-output/package-consumer-unpinned*/evidence-*.json

  production-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - run: npm ci --engine-strict=false
      - name: Build workspace runtime dependencies
        run: npm run build:es
      - name: Install production acceptance browser
        run: npx playwright install --with-deps chromium
      - name: Verify current standalone and installed ESM consumer in Chromium
        run: npm run test:browser -w @jentic/arazzo-ui
      - name: Upload production browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arazzo-ui-production-browser
          path: packages/jentic-arazzo-ui/test-output/browser
